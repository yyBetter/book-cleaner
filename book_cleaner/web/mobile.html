<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <title>超级扫描仪 · 手机光学采集端</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="mobile-app">
    <header class="mobile-topbar">
      <div class="toolbar-between" style="flex-wrap:nowrap;">
        <div style="min-width:0;">
          <div class="muted-note">超级扫描仪 · 手机光学采集端</div>
          <h1 id="mobileBookTitle" style="margin:1px 0 0;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">加载书目中...</h1>
        </div>
        <div class="mobile-header-actions">
          <button id="mobileThemeBtn" type="button" class="btn btn-compact" aria-label="切换暗房防反光模式">暗房</button>
          <span id="mobilePageCountPill" class="pill pill-ok">0 页</span>
        </div>
      </div>
      <div class="toolbar-row" style="flex-wrap:nowrap;">
        <select id="mobileBookSelect" class="book-select" style="flex:1;min-width:0;"></select>
        <label class="toggle-item toggle-compact">
          <input id="mobileSplitSpreadChk" class="toggle-switch" type="checkbox">
          <span>双页拆单</span>
        </label>
      </div>
    </header>

    <!-- Secure context live Android Chrome studio (USB 127.0.0.1 or Wi-Fi HTTPS) -->
    <section id="mobileLiveCard" class="mobile-stage-live hidden">
      <div class="mobile-status-strip">
        <span id="mobileZeroStoragePill" class="pill pill-ok">0存储直传</span>
        <div class="toolbar-row" style="gap:6px;flex-wrap:nowrap;">
          <span id="mobileCaptureModeBadge" class="pill">检测静帧...</span>
          <span id="mobileQueueBadge" class="pill">待传 0</span>
        </div>
      </div>

      <div class="viewport-box mobile-viewport">
        <video id="mobileVideo" autoplay playsinline muted></video>
        <div class="optical-ruler-top" aria-hidden="true"></div>
        <div class="optical-ruler-left" aria-hidden="true"></div>
        <div class="thumb-zone-left">压书区<br>自动擦除</div>
        <div class="thumb-zone-right">压书区<br>自动擦除</div>
        <div id="mobileCenterGuide" class="center-clear-guide">
          <span class="reticle-corner tl" aria-hidden="true"></span>
          <span class="reticle-corner tr" aria-hidden="true"></span>
          <span class="reticle-corner bl" aria-hidden="true"></span>
          <span class="reticle-corner br" aria-hidden="true"></span>
        </div>
        <div id="mobileShutterFlash" class="shutter-flash" aria-hidden="true"></div>
        <div class="settle-meter"><div id="mobileSettleFill" class="settle-meter-fill"></div></div>
        <div class="hud-overlay">
          <span id="mobileSmartHud">压书自动抓拍：就绪</span>
          <span id="mobileResHud">-</span>
        </div>
      </div>
    </section>

    <!-- Plain-HTTP fallback when browser stream is unavailable -->
    <section id="mobileNativeCard" class="card mobile-native-fallback">
      <div id="mobileContextNotice" class="muted-note" style="margin-bottom:10px;">
        当前为普通局域网 HTTP 备用模式（系统相机可能会生成临时相册文件）。建议使用 Android USB 直连或 Windows HTTPS 模式解锁「手机 0 存储」内存直传。
      </div>
      <label class="btn btn-shutter mobile-shutter-big" style="cursor:pointer;">
        <span>备用：调用系统相机拍一页</span>
        <input id="mobileNativeCameraInput" type="file" accept="image/*" capture="environment" class="hidden">
      </label>
    </section>

    <div id="mobileStatusBanner" class="mobile-qa-ticker">
      <span class="muted-note" style="flex:none;">质检</span>
      <span id="mobileQaResult" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">准备就绪，双手可压住左右蓝区翻拍</span>
    </div>

    <div class="mobile-deck">
      <div class="mobile-deck-side">
        <button id="mobileUndoBtn" type="button" class="btn btn-sm btn-warn">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          <span>撤销</span>
        </button>
      </div>

      <button id="mobileLiveShutterBtn" type="button" class="mobile-shutter-ring" aria-label="手动补拍一页（内存直传）" title="手动补拍一页">
        <span class="mobile-shutter-core">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg>
        </span>
      </button>

      <div class="mobile-deck-side is-right">
        <button id="mobileTorchBtn" type="button" class="btn btn-sm hidden">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>补光</span>
        </button>
        <label class="toggle-item toggle-compact" title="翻页稳定自动抓拍">
          <input id="mobileAutoTriggerChk" class="toggle-switch" type="checkbox" checked>
          <span>自动</span>
        </label>
      </div>
    </div>

    <div class="mobile-recent-bar">
      <div id="mobileRecentStrip" class="recent-strip scroller"></div>
    </div>
  </main>

  <script type="module" src="/static/mobile.js"></script>
</body>
</html>
