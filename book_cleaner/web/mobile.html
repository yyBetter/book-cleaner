<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Android 采集伴侣 · Book Cleaner</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="mobile-shell">
    <div class="card">
      <div class="toolbar-between" style="flex-wrap:nowrap;">
        <div style="min-width:0;">
          <div class="muted-note">Android 采集端（压书手自动避让）</div>
          <h1 id="mobileBookTitle" style="margin:2px 0 0;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">加载书目中...</h1>
        </div>
        <span id="mobilePageCountPill" class="pill pill-ok">0 页</span>
      </div>
      <div class="toolbar-row" style="margin-top:10px;flex-wrap:nowrap;">
        <select id="mobileBookSelect" class="book-select" style="flex:1;min-width:0;"></select>
        <label class="toggle-item toggle-compact">
          <input id="mobileSplitSpreadChk" type="checkbox">
          <span>双页拆单</span>
        </label>
      </div>
    </div>

    <!-- Secure context live Android Chrome studio (USB 127.0.0.1 or Wi-Fi HTTPS) -->
    <div id="mobileLiveCard" class="card hidden">
      <div class="toolbar-between" style="margin-bottom:8px;">
        <span id="mobileZeroStoragePill" class="pill pill-ok">内存直传 · 手机 0 存储</span>
        <div class="toolbar-row" style="gap:6px;">
          <span id="mobileCaptureModeBadge" class="pill">检测硬件静帧中...</span>
          <span id="mobileQueueBadge" class="pill">待传 0</span>
        </div>
      </div>
      <div class="viewport-box mobile-viewport">
        <video id="mobileVideo" autoplay playsinline muted></video>
        <div class="thumb-zone-left">拇指压书区<br>自动擦除</div>
        <div class="thumb-zone-right">拇指压书区<br>自动擦除</div>
        <div id="mobileCenterGuide" class="center-clear-guide"></div>
        <div class="settle-meter"><div id="mobileSettleFill" class="settle-meter-fill"></div></div>
        <div class="hud-overlay">
          <span id="mobileSmartHud">压书自动抓拍：就绪</span>
          <span id="mobileResHud">-</span>
        </div>
      </div>

      <div class="mobile-ctrl-row">
        <label class="toggle-item" style="flex:1;min-width:165px;">
          <input id="mobileAutoTriggerChk" type="checkbox" checked>
          <span>压书手辅助全自动抓拍</span>
        </label>
        <button id="mobileTorchBtn" type="button" class="btn hidden">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>开启补光灯</span>
        </button>
        <button id="mobileUndoBtn" type="button" class="btn btn-warn">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          <span>撤销上一页</span>
        </button>
      </div>

      <button id="mobileLiveShutterBtn" type="button" class="btn btn-primary mobile-shutter-big" style="margin-top:10px;">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
        <span>手动补拍一页（内存直传）</span>
      </button>
    </div>

    <!-- Native Camera Capture (strictly plain-HTTP fallback when browser camera stream is unavailable) -->
    <div id="mobileNativeCard" class="card">
      <div id="mobileContextNotice" class="muted-note" style="margin-bottom:10px;">
        当前为普通局域网 HTTP 备用模式（系统相机可能会生成临时相册文件）。建议使用 Android USB 直连或 Windows HTTPS 模式解锁「手机 0 存储」内存直传。
      </div>
      <label class="btn btn-primary mobile-shutter-big" style="cursor:pointer;">
        <span>备用：调用系统相机拍一页</span>
        <input id="mobileNativeCameraInput" type="file" accept="image/*" capture="environment" class="hidden">
      </label>
    </div>

    <div id="mobileStatusBanner" class="panel-inset">
      <div class="muted-note">上传与即时质检反馈</div>
      <div id="mobileQaResult" class="qa-summary-title" style="margin-top:4px;">准备就绪，双手可压住左右蓝区翻拍</div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px;">本机最近拍摄</div>
      <div id="mobileRecentStrip" class="recent-strip scroller"></div>
    </div>
  </main>

  <script type="module" src="/static/mobile.js"></script>
</body>
</html>
