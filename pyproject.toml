[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "book-cleaner"
version = "0.1.0"
description = "100k-page paper book capture, OpenCV cleaning, offline RapidOCR, optional LLM proofreading, and multi-format export workbench."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "rapidocr-onnxruntime>=1.4.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "segno>=1.6.1",
    "psutil>=6.0.0",
    "cryptography>=43.0.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
book-cleaner = "book_cleaner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["book_cleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
